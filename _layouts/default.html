<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% if page.titre %}{{ page.titre }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.description %}{{ page.description | escape }}{% else %}{{ site.description | escape }}{% endif %}">
  <meta name="theme-color" content="#1f55d8">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{% if page.titre %}{{ page.titre | escape }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{% if page.description %}{{ page.description | escape }}{% else %}{{ site.description | escape }}{% endif %}">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_FR">
  {% if page.noindex %}<meta name="robots" content="noindex">{% endif %}
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Silkscreen:wght@400;700&amp;family=Space+Mono:wght@400;700&amp;display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <script>
    (function () {
      var h = document.documentElement;
      h.className += ' js';
      try {
        var calm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (!calm && !sessionStorage.getItem('ld-boot')) {
          h.className += ' boot';
          sessionStorage.setItem('ld-boot', '1');
        }
      } catch (e) {}
    })();
  </script>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</head>
<body class="ld-desktop">
  <div class="ld-boot" aria-hidden="true">
    <span class="ld-boot-label">Démarrage de LOUIS_DEPLOYS.EXE…</span>
    <div class="ld-progress"><div class="ld-progress-fill"></div></div>
  </div>
{{ content }}
</body>
</html>
