---
layout: default
---
<main class="page simple">
  <div class="win-wrap">
    <section class="ld-window" aria-labelledby="simple-title">
      <header class="ld-titlebar">
        <svg class="ld-titlebar-icon" viewBox="0 0 16 16" aria-hidden="true" shape-rendering="crispEdges">
          <rect x="2" y="1" width="10" height="14" fill="var(--surface-paper)" stroke="var(--ink)"/>
          <rect x="4" y="4" width="6" height="1" fill="var(--blue-luna)"/><rect x="4" y="7" width="6" height="1" fill="var(--blue-luna)"/><rect x="4" y="10" width="4" height="1" fill="var(--blue-luna)"/>
        </svg>
        <span class="ld-titlebar-title">{{ page.fichier }}</span>
        <a class="ld-tbtn ld-tbtn--close" href="{{ '/' | relative_url }}" aria-label="Retour à l'accueil">×</a>
      </header>
      <div class="ld-window-body">
        <h1 class="titre-section" id="simple-title" style="margin:0 0 16px">{{ page.titre }}</h1>
        {{ content }}
      </div>
    </section>
  </div>
  <p class="site-foot texte-petit"><a href="{{ '/' | relative_url }}">Retour à l'accueil</a></p>
</main>
